---
- name: Edit SYN protections and profiles
  hosts: cc
  gather_facts: false
  vars_files:
    - ../vars/cc.yml
    - ../vars/edit_vars.yml

  tasks:
    - name: SYN protections and profiles block
      block:
        - name: Lock device(s)
          dp_lock:
            provider: "{{ cc }}"
            dp_ip: "{{ item }}"
          loop: "{{ dp_ip }}"
          when: not (skip_device_lock | default(false))

        - name: Edit SYN protections and profiles
          edit_syn_configuration:
            provider: "{{ cc }}"
            dp_ip: "{{ item }}"
            syn_protections: "{{ edit_syn_protections | default([]) }}"
            syn_profiles: "{{ edit_syn_profiles | default([]) }}"
          loop: "{{ dp_ip }}"
          loop_control:
            label: "Device: {{ item }}"
          register: syn_edit_results

        - name: Display SYN edit results (details + summary)
          vars:
            syn_output: |
              Device: {{ item.item }}
              {% if item.failed | default(false) %}
              ────────────────────────────────────────────────
              Error during SYN edit:
                → {{ item.msg | default('Unknown error') }}
              {% else %}
              {% if item.response.protections | length > 0 %}
              ────────────────────────────────────────────────
              Protections ({{ item.response.protections | length }}):
              {% for prot in item.response.protections %}
                - Name: {{ prot.name }}
                  Parameters:
                    Activation Threshold: {{ prot.parameters.activation_threshold | default('N/A') }}
                    Termination Threshold: {{ prot.parameters.termination_threshold | default('N/A') }}
                    App Port Group: {{ prot.parameters.app_port_group | default('N/A') }}
              {% endfor %}
              {% endif %}

              {% if item.response.profiles | length > 0 %}
              ────────────────────────────────────────────────
              Profiles ({{ item.response.profiles | length }}):
              {% for prof in item.response.profiles %}
                - Profile Name: {{ prof.profile_name }}
                  Attached Protections: {{ prof.protection_names | default([]) | join(', ') if prof.protection_names | default([]) | length > 0 else 'N/A' }}
                  Parameters:
                  {% for key, val in prof.parameters.items() %}
                    {{ key | replace('_',' ') | title }}: {{ val | default('N/A') }}
                  {% endfor %}
                  {% if prof.skipped | default({}) | length > 0 %}
                  Not Applicable (ignored by device):
                  {% for key, reason in prof.skipped.items() %}
                    {{ key | replace('_',' ') | title }}: {{ reason }}
                  {% endfor %}
                  {% endif %}
              {% endfor %}
              {% endif %}

              ────────────────────────────────────────────────
              SYN Summary:
                - Total protections attempted: {{ item.response.summary.total_protections_attempted | default(0) }}
                - Protections edited: {{ item.response.summary.protections_edited | default(0) }}
                - Total profiles attempted: {{ item.response.summary.total_profiles_attempted | default(0) }}
                - Profiles updated: {{ item.response.summary.profiles_updated | default(0) }}
              {% endif %}
          ansible.builtin.debug:
            msg: "{{ syn_output.split('\n') }}"
          loop: "{{ syn_edit_results.results }}"
          loop_control:
            label: "Device: {{ item.item }}"

        - name: Apply policy updates per device
          update_policies:
            provider: "{{ cc }}"
            dp_ip: "{{ item }}"
          loop: "{{ dp_ip }}"
          loop_control:
            label: "Applying policies: {{ item }}"
          when:
            - not (skip_policy_updates | default(false))
            - syn_edit_results is defined
            - syn_edit_results.changed | default(false)

      always:
        - name: Unlock device(s)
          dp_unlock:
            provider: "{{ cc }}"
            dp_ip: "{{ item }}"
          loop: "{{ dp_ip }}"
          when: not (skip_device_lock | default(false))
