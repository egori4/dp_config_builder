---
- name: Create SYN protections and profiles
  hosts: cc
  gather_facts: false
  vars_files:
    - ../vars/cc.yml
    - ../vars/create_vars.yml

  tasks:
    - name: SYN protections and profiles block
      block:
        - name: Lock device(s)
          dp_lock:
            provider: "{{ cc }}"
            dp_ip: "{{ item }}"
          loop: "{{ dp_ip }}"
          when: not (skip_device_lock | default(false))

        - name: Configure SYN protections and profiles
          create_syn_configuration:
            provider: "{{ cc }}"
            dp_ip: "{{ item }}"
            syn_protections: "{{ create_syn_protections | default([]) }}"
            syn_profiles: "{{ create_syn_profiles | default([]) }}"
          loop: "{{ dp_ip }}"
          loop_control:
            label: "Device: {{ item }}"
          register: syn_create_results

        - name: Display SYN creation results (details + summary)
          vars:
            syn_output: |
              Device: {{ item.item }}
              {% if item.response.preview_mode | default(false) %}
              PREVIEW MODE - Operations that would be performed:
              {% set planned_prots = item.response.planned_protections | default([]) %}
              {% set planned_profs = item.response.planned_profiles | default([]) %}
              {% if planned_prots %}
              SYN Protections ({{ planned_prots | length }} planned):
              {% for name in planned_prots %}
                - {{ name }}
              {% endfor %}
              {% endif %}
              {% if planned_profs %}
              SYN Profiles ({{ planned_profs | length }} planned):
              {% for op in planned_profs %}
                - {{ op.profile_name }}
                  Protections: {{ op.protections | join(', ') if op.protections else 'none' }}
                  Parameters:
              {% for k, v in op.params.items() %}
                    - {{ k }}: {{ v }}
              {% endfor %}
              {% endfor %}
              {% endif %}
              {% if not planned_prots and not planned_profs %}
              No SYN protections or profiles configured for creation.
              {% endif %}
              {% else %}
              EXECUTION RESULTS:
              {% set prots = item.response.created_protections | default([]) %}
              {% set profs = item.response.created_profiles | default([]) %}
              {% set errs = item.response.errors | default([]) %}
              {% if prots %}
              SYN Protections created successfully:
              {% for prot in prots %}
                - {{ prot.name }}
                  Parameters:
              {% for k, v in prot.parameters.items() %}
                    - {{ k }}: {{ v }}
              {% endfor %}
              {% endfor %}
              {% endif %}
              {% if profs %}
              SYN Profiles created successfully:
              {% for prof in profs %}
                - {{ prof.profile_name }}
                  Attached Protections: {{ prof.protections | join(', ') if prof.protections else 'none' }}
              {% if prof.parameters %}
                  Parameters:
              {% for k, v in prof.parameters.items() %}
                    - {{ k }}: {{ v }}
              {% endfor %}
              {% endif %}
              {% if prof.skipped %}
                  Not applicable for this mode (not sent to device):
              {% for k, reason in prof.skipped.items() %}
                    - {{ k }}: {{ reason }}
              {% endfor %}
              {% endif %}
              {% endfor %}
              {% endif %}
              {% if not prots and not profs %}
              No SYN protections or profiles were created.
              {% endif %}
              {% if errs %}
              Errors ({{ errs | length }}):
              {% for err in errs %}
                - {{ err }}
              {% endfor %}
              {% endif %}
              SYN Summary:
                - Protections created: {{ item.response.summary.protections_created | default(0) }} of {{ item.response.summary.total_protections_attempted | default(0) }}
                - Profiles created: {{ item.response.summary.profiles_created | default(0) }} of {{ item.response.summary.total_profiles_attempted | default(0) }}
                - Errors: {{ item.response.summary.errors_count | default(0) }}
              {% endif %}
          ansible.builtin.debug:
            msg: "{{ syn_output.split('\n') }}"
          loop: "{{ syn_create_results.results }}"
          loop_control:
            label: "Device: {{ item.item }}"

        - name: Apply policy updates per device
          update_policies:
            provider: "{{ cc }}"
            dp_ip: "{{ item }}"
          loop: "{{ dp_ip }}"
          loop_control:
            label: "Applying policies: {{ item }}"
          when:
            - not (skip_policy_updates | default(false))
            - syn_create_results is defined
            - syn_create_results.changed | default(false)

      always:
        - name: Unlock device(s)
          dp_unlock:
            provider: "{{ cc }}"
            dp_ip: "{{ item }}"
          loop: "{{ dp_ip }}"
          when: not (skip_device_lock | default(false))
